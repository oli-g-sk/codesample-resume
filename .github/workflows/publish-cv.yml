name: Publish CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:

  # Validate the README page on PRs; publish it only after merging to main.
  build-site:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Render README as the Pages entry point
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 src/site/render.py

      - name: Upload rendered site
        uses: actions/upload-artifact@v7
        with:
          name: cv-site
          path: build/public
          if-no-files-found: error
          retention-days: 1

  # Render on Windows, where Bahnschrift is installed.
  # Pass the PDF to the deployment job as an artifact.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      - name: Verify Bahnschrift is available
        shell: pwsh
        run: |
          $fonts = typst fonts
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list fonts."
          }
          if (-not ($fonts -match 'Bahnschrift')) {
            throw "Bahnschrift is unavailable on this runner."
          }

      - name: Build PDF
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          typst compile cv.typ build/cv.pdf
          if ($LASTEXITCODE -ne 0) {
            throw "CV compilation failed."
          }

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: build/cv.pdf
          if-no-files-found: error
          retention-days: 1

  # Publish on Ubuntu, which supports the Pages deployment actions.
  # Uses the PDF built on Windows without needing its fonts.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, build-site]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download rendered site
        uses: actions/download-artifact@v8
        with:
          name: cv-site
          path: build/public

      - name: Download PDF
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: build/public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload published files
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
